name: Build Mystralis RUI1 Kernel (BISECT KSU-only)

on:
  push:
    branches:
      - mystralis-rui1-bisect
  workflow_dispatch:
    inputs:
      noop:
        description: "Manual re-run of the bisect build"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_IMAGE: "Image.gz-dtb"
  PROTON_CLANG_REPO: "https://github.com/kdrag0n/proton-clang.git"
  # Same AnyKernel base the main branch uses; kernel.string is rewritten below.
  ANYKERNEL_REPO: "https://github.com/decrypt64bit/anykernel_rmx1971_rui_one.git"
  ANYKERNEL_BRANCH: "main"
  # Hookless KSU driver (backslashxx/KernelSU line, KSU_TAMPER_SYSCALL_TABLE,
  # no KPROBES dependency). v3.3.1+22 was renamed upstream to v3.3.1-22.
  KERNELSU_REPO: "https://github.com/backslashxx/KernelSU"
  KERNELSU_SETUP_BRANCH: v3.3.1-22
  KBUILD_BUILD_USER: "@decrypt64bit"
  KBUILD_BUILD_HOST: "ubuntu-24.04"

jobs:
  build:
    name: BISECT KSU-only (${{ matrix.variant.codename }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          # Boot bisect step A: base tree + hookless backslashxx KSU only.
          # All SUSFS kernel-side code is compiled out (CONFIG_KSU_SUSFS=n)
          # and MGLRU is off (CONFIG_LRU_GEN=n). Everything else (toolchain,
          # linker flags, DTB, AnyKernel, device) is identical to the main
          # branch's failing builds, so a boot here isolates the failure to
          # the SUSFS or MGLRU port; a failure here indicts the base+driver
          # or the packaging instead.
          - device: "5Pro"
            codename: "RMX1971"
            defconfig: "RMX1971_defconfig"
          - device: "XT"
            codename: "RMX1921"
            defconfig: "RMX1921_defconfig"

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-sdm670-kernel-rui1
          max-size: 10G

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex git libelf-dev lld \
            libncurses5-dev libssl-dev make rsync unzip zip python3 python-is-python3

      - name: Set up Toolchain
        run: |
          git clone --depth 1 $PROTON_CLANG_REPO .deps/proton-clang

      - name: Set up AnyKernel3
        run: |
          git clone --depth 1 -b "$ANYKERNEL_BRANCH" "$ANYKERNEL_REPO" .deps/AnyKernel3

      - name: Integrate KernelSU (hookless)
        run: |
          set -eu
          # Inline equivalent of kernel/setup.sh, but cloning KERNELSU_REPO
          # instead of the URL that script hardcodes.
          git clone --depth 1 -b "$KERNELSU_SETUP_BRANCH" "$KERNELSU_REPO" KernelSU
          git -C KernelSU rev-parse HEAD
          DRIVER_DIR=drivers
          test -d "$DRIVER_DIR" || { echo "no $DRIVER_DIR"; exit 1; }
          ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$GITHUB_WORKSPACE/KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_DIR/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig" || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"
          echo "--- Makefile tail ---"; tail -3 "$DRIVER_DIR/Makefile"
          echo "--- Kconfig around endmenu ---"; grep -n -B1 -A1 'kernelsu' "$DRIVER_DIR/Kconfig"

      - name: Configure and Build Kernel (KSU only, no SUSFS, no MGLRU)
        env:
          KERNEL_DEFCONFIG: ${{ matrix.variant.defconfig }}
        run: |
          mkdir -p out

          TC_PATH="${{ github.workspace }}/.deps/proton-clang/bin"
          export HOSTCFLAGS="-Wno-unused-command-line-argument"

          make O=out ARCH=arm64 \
            CC="$TC_PATH/clang" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            $KERNEL_DEFCONFIG

          # BISECT: compile out every SUSFS kernel-side hook and MGLRU. The
          # SUSFS tree code stays (it is #ifdef-guarded) but none of it is
          # built, and the KSU-side susfs patch is deliberately not applied.
          ./scripts/config --file out/.config \
             --disable KSU_SUSFS \
             --disable LRU_GEN

          ./scripts/config --file out/.config \
             --set-str CONFIG_LOCALVERSION "-Mystralis-RUI1-ksuonly"

          make O=out ARCH=arm64 \
            CC="$TC_PATH/clang" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_PATH/arm-linux-gnueabi-" \
            olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache $TC_PATH/clang" \
            LD="$TC_PATH/ld.lld" \
            AR="$TC_PATH/llvm-ar" \
            NM="$TC_PATH/llvm-nm" \
            OBJCOPY="$TC_PATH/llvm-objcopy" \
            OBJDUMP="$TC_PATH/llvm-objdump" \
            READELF="$TC_PATH/llvm-readelf" \
            STRIP="$TC_PATH/llvm-strip" \
            CROSS_COMPILE="$TC_PATH/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TC_PATH/arm-linux-gnueabi-" \
            LLVM=1 LLVM_IAS=1

      - name: Verify KSU-only configuration
        run: |
          set -eu
          grep -q '^CONFIG_KSU=y' out/.config
          grep -qx '# CONFIG_KSU_SUSFS is not set' out/.config || {
            echo "BISECT build must have CONFIG_KSU_SUSFS disabled" >&2; exit 1; }
          grep -qx '# CONFIG_LRU_GEN is not set' out/.config || {
            echo "BISECT build must have CONFIG_LRU_GEN disabled" >&2; exit 1; }
          test -d out/drivers/kernelsu || { echo "KSU driver not built" >&2; exit 1; }
          ! test -f out/fs/susfs.o
          ! test -f out/fs/susfs_kernel.o
          echo "KSU-only bisect config verified"

      - name: Package AnyKernel3
        id: package
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/$KERNEL_IMAGE artifacts/
          cp out/.config artifacts/kernel.config

          mkdir -p .deps/AnyKernel3_staging
          cp -r .deps/AnyKernel3/* .deps/AnyKernel3_staging/
          cp out/arch/arm64/boot/$KERNEL_IMAGE .deps/AnyKernel3_staging/

          # The flash-time build name must read the exact bisect variant, and
          # the device check must match the target device of this zip.
          sed -i "s|^kernel.string=.*|kernel.string=Mystralis-RUI1-ksuonly (${{ matrix.variant.codename }})|" .deps/AnyKernel3_staging/anykernel.sh
          if [ "${{ matrix.variant.codename }}" != "RMX1971" ]; then
            sed -i "s/RMX1971/RMX1921/g" .deps/AnyKernel3_staging/anykernel.sh
          fi
          echo "--- anykernel.sh identity ---"
          grep -n "kernel.string\|device.name" .deps/AnyKernel3_staging/anykernel.sh

          BUILD_DATE=$(date -u +%Y%m%d-%H%M)
          ZIP_NAME="Mystralis-RUI1-ksuonly-${{ matrix.variant.codename }}-${BUILD_DATE}.zip"

          cd .deps/AnyKernel3_staging
          zip -r9 ../../artifacts/$ZIP_NAME . -x '.git*' 'README.md'
          cd ../..

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-artifacts-ksuonly-${{ matrix.variant.codename }}
          path: artifacts/*
